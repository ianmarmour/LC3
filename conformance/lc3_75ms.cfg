# LC3 conformance configuration for conformanceCheck.py (LC3 conformance
# interoperability test software), frame duration 7.5 ms.
# Covers the test cases of the LC3 Test Suite (LC3.TS) for this frame duration.
# Paths are relative to the directory of conformanceCheck.py, see README.md.

[globals]
enabled_tests = ENC_75MS, DEC_75MS, ENCDEC_75MS
frame_ms = 7.5

encoder = ./lc3 -E -frame_ms {frame_ms} {options} "{input}" "{output}" {bitrate}
decoder = ./lc3 -D {options} "{input}" "{output}"

# gstPEAQ (see README.md); with gstPEAQ the ODG threshold of conformanceCheck.py is 0.07.
peaq_bin = ./peaq --gst-plugin-load ./libgstpeaq.so --advanced "{reference}" "{test}"
peaq_odg_regex = Objective Difference Grade:\s+(-?\d+.\d+)

[ENC_75MS]
test_sqam           = 1
test_band_limiting  = 1
test_low_pass       = 1
test_rate_switching = 0

configs = encode, 8000, 27734
          encode, 16000, 32000
          encode, 24000, 48000
          encode, 32000, 61867
          encode, 32000, 64000
          encode, 44100, 79380
          encode, 44100, 95060
          encode, 44100, 123480
          encode, 48000, 80000
          encode, 48000, 96000
          encode, 48000, 124800

[DEC_75MS]
test_sqam           = 1
test_band_limiting  = 0
test_low_pass       = 0
test_rate_switching = 0

configs = decode, 8000, 27734
          decode, 16000, 32000
          decode, 24000, 48000
          decode, 32000, 61867
          decode, 32000, 64000
          decode, 44100, 79380
          decode, 44100, 95060
          decode, 44100, 123480
          decode, 48000, 80000
          decode, 48000, 96000
          decode, 48000, 124800

[ENCDEC_75MS]
test_sqam           = 1
test_band_limiting  = 0
test_low_pass       = 0
test_rate_switching = 0

configs = encdec, 8000, 27734
          encdec, 16000, 32000
          encdec, 24000, 48000
          encdec, 32000, 61867
          encdec, 32000, 64000
          encdec, 44100, 79380
          encdec, 44100, 95060
          encdec, 44100, 123480
          encdec, 48000, 80000
          encdec, 48000, 96000
          encdec, 48000, 124800
