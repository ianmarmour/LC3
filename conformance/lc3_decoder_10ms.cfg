# LC3 conformance configuration for conformanceCheck.py (LC3 conformance
# interoperability test software), frame duration 10 ms.
# Covers the test cases of the LC3 Test Suite (LC3.TS) for this frame duration.
# Paths are relative to the directory of conformanceCheck.py, see README.md.

[globals]
enabled_tests = DEC_10MS
frame_ms = 10

encoder = ./lc3 -E -frame_ms {frame_ms} {options} "{input}" "{output}" {bitrate}
decoder = ./lc3 -D {options} "{input}" "{output}"

# The decoder tests use the RMS criteria only, no PEAQ tool is needed.
peaq_bin = true "{reference}" "{test}"
peaq_odg_regex = Objective Difference Grade:\s+(-?\d+.\d+)

[DEC_10MS]
test_sqam           = 1
test_band_limiting  = 0
test_low_pass       = 0
test_rate_switching = 0

configs = decode, 8000, 24000
          decode, 16000, 32000
          decode, 24000, 48000
          decode, 32000, 64000
          decode, 44100, 79380
          decode, 44100, 95550
          decode, 44100, 123480
          decode, 48000, 80000
          decode, 48000, 96000
          decode, 48000, 124000
